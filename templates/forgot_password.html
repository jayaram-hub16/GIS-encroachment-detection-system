<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Municipal GIS System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #0a0e1a; --bg-card: #1a2235; --bg-input: #0f1520;
            --accent-blue: #3b82f6; --accent-cyan: #06b6d4;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
            --border-color: #1e2d45; --border-active: #3b82f6;
            --accent-green: #22c55e; --accent-red: #ef4444;
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg-primary);
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .wrapper { position: relative; z-index: 10; width: 100%; max-width: 440px; padding: 20px; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 40px 36px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(59,130,246,0.08);
        }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .logo-icon {
            width: 48px; height: 48px; border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: white;
        }
        .logo-text { font-size: 22px; font-weight: 700; color: var(--text-primary); }
        .logo-sub { font-size: 12px; color: var(--text-muted); }
        h1 { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        p.sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        input[type="text"], input[type="email"] {
            width: 100%; padding: 12px 14px 12px 42px;
            background: var(--bg-input); border: 1.5px solid var(--border-color);
            border-radius: 10px; color: var(--text-primary); font-size: 14px; font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--border-active); }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 10px; cursor: pointer;
            font-size: 15px; font-weight: 600; font-family: inherit;
            background: linear-gradient(135deg, #3b82f6, #06b6d4); color: white;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .alert {
            padding: 12px 16px; border-radius: 10px; font-size: 13px;
            margin-bottom: 20px; display: flex; align-items: flex-start; gap: 10px;
        }
        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .back-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .back-link a { color: var(--accent-blue); text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-building-shield"></i></div>
            <div>
                <div class="logo-text">MuniGIS</div>
                <div class="logo-sub">Municipal Encroachment System</div>
            </div>
        </div>

        <h1><i class="fa-solid fa-key"></i> Forgot Password</h1>
        <p class="sub">Enter your registered email or username and we'll send you a secure reset link.</p>

        {% if error %}
        <div class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {% if message %}
        <div class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span>{{ message }}</span>
        </div>
        <div class="back-link">
            <a href="{{ url_for('login_page') }}"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>
        {% else %}
        <form method="POST">
            <div class="form-group">
                <label for="identifier">Email or Username</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="identifier" name="identifier"
                           placeholder="Enter email or username" required>
                </div>
            </div>
            <button type="submit" class="btn">
                <i class="fa-solid fa-paper-plane"></i> Send Reset Link
            </button>
        </form>
        <div class="back-link" style="margin-top: 16px;">
            <a href="{{ url_for('login_page') }}"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>
        {% endif %}
    </div>
</div>
</body>
</html>
